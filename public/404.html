<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Signal Not Found | LI Labs</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100dvh;
        background: #040404;
        color: #f5f5f5;
        font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        -webkit-font-smoothing: antialiased;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      main {
        width: 100%;
        max-width: 28rem;
        border: 1px solid #262626;
        background: rgba(10, 10, 10, 0.9);
        padding: 32px;
      }
      .meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 11px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #737373;
        margin-bottom: 18px;
      }
      .code {
        color: #facc15;
        font-weight: 600;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: -0.02em;
        color: #ffffff;
      }
      p {
        margin: 0 0 22px;
        font-size: 12px;
        line-height: 1.65;
        color: #a3a3a3;
      }
      p span {
        color: #e5e5e5;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        font-size: 11px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      a {
        text-decoration: none;
        padding: 9px 16px;
        transition: background-color 150ms ease, border-color 150ms ease, color 150ms ease;
      }
      a.primary {
        border: 1px solid #ffffff;
        background: #ffffff;
        color: #040404;
        font-weight: 600;
      }
      a.primary:hover {
        background: #e5e5e5;
      }
      a.secondary {
        border: 1px solid #404040;
        color: #e5e5e5;
      }
      a.secondary:hover {
        border-color: #ffffff;
        color: #ffffff;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="meta">
        <span>LI LABS // STATUS</span>
        <span class="code">404</span>
      </div>
      <h1>Route not found</h1>
      <p>
        The requested node does not exist on <span>lilabs.aliahad.com</span>. Return to the interactive neural field or
        browse the open-source catalog.
      </p>
      <div class="actions">
        <a class="primary" href="/">Home Field</a>
        <a class="secondary" href="/product/">Products</a>
      </div>
    </main>
  </body>
</html>
